#
# Two-crate workspace test for the hyperi-ci pipeline. Exercises:
#
#   1. [workspace.dependencies] inheritance — hyperi-rustlib version
#      pinned at workspace root, members consume via .workspace = true.
#   2. Multi-crate VERSION sync - members set version.workspace = true, so
#      hyperi-ci stamp-version writes [workspace.package].version once and
#      both crates inherit it (no per-crate releaserc exec needed).
#   3. Workspace-aware clippy / feature_matrix / cargo metadata
#      iteration in hyperi-ci's quality + container handlers.
#   4. Container build of one workspace member while another member
#      is a dependency.

[workspace]
members = ["crates/core", "crates/cli"]
resolver = "2"

[workspace.package]
# Repo-level description for the OCI image label, GHCR's package page and the
# GitHub blurb. Members keep their own [package] description -- a core library
# and a CLI describe different things -- so nothing inherits this one.
description = "hyperi-ci E2E fixture: two-crate Rust workspace, version inheritance"
version = "1.0.5"
edition = "2021"
rust-version = "1.82"
license = "FSL-1.1-ALv2"
authors = ["HYPERI PTY LIMITED"]

[workspace.dependencies]
hyperi-rustlib = { version = ">=2.5.4", default-features = false, features = ["logger", "cli"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
opt-level = 3
